<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#281324" />
      <stop offset="70%" stop-color="#180E17" />
      <stop offset="100%" stop-color="#0E070D" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEFD8" />
      <stop offset="35%" stop-color="#E8BD6F" />
      <stop offset="70%" stop-color="#D99E41" />
      <stop offset="100%" stop-color="#9E6922" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.85" />
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4" />

  <g transform="translate(256, 256)">
    <circle cx="0" cy="0" r="175" fill="none" stroke="#D99E41" stroke-width="1" opacity="0.3" />
    
    <!-- Monogram ОП in Cormorant / Didot Academic serif -->
    <!-- Letter O -->
    <path d="M-60 -95 C-12 -95 18 -55 18 10 C18 75 -12 115 -60 115 C-108 115 -138 75 -138 10 C-138 -55 -108 -95 -60 -95 Z M-60 -75 C-88 -75 -106 -42 -106 10 C-106 62 -88 95 -60 95 C-32 95 -14 62 -14 10 C-14 -42 -32 -75 -60 -75 Z" fill="url(#goldGrad)" filter="url(#subtleGlow)" />
    
    <!-- Letter П (Russian P) -->
    <!-- Top bar with academic serifs -->
    <path d="M12 -88 L142 -88 L142 -76 L124 -76 L124 82 L138 82 L138 94 L88 94 L88 82 L102 82 L102 -76 L52 -76 L52 82 L66 82 L66 94 L16 94 L16 82 L30 82 L30 -76 L12 -76 Z" fill="url(#goldGrad)" filter="url(#subtleGlow)" />

    <!-- Artistic paint stroke accent -->
    <path d="M-90 148 Q0 178 90 148 Q40 162 -90 148 Z" fill="#E8BD6F" opacity="0.75" />
    <circle cx="95" cy="148" r="4.5" fill="#FCEFD8" />
  </g>
</svg>
