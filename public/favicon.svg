<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B0E19"/>
      <stop offset="50%" stop-color="#140A12"/>
      <stop offset="100%" stop-color="#0A0409"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFF0D0"/>
      <stop offset="25%" stop-color="#F3CA68"/>
      <stop offset="55%" stop-color="#D99E41"/>
      <stop offset="85%" stop-color="#B27420"/>
      <stop offset="100%" stop-color="#7C4B0E"/>
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E8"/>
      <stop offset="50%" stop-color="#FCD57C"/>
      <stop offset="100%" stop-color="#D99E41"/>
    </linearGradient>

    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D07A" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#B77B26" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E5B252" stop-opacity="0.75"/>
    </linearGradient>

    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D99E41" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#D99E41" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#D99E41" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="none" stroke="url(#goldBorder)" stroke-width="8"/>

  <!-- Subtle Ambient Radial Glow in Center -->
  <circle cx="256" cy="256" r="170" fill="url(#haloGlow)"/>

  <!-- Abstract Art Mark: Diamond Canvas with Fluid Dynamic Painterly Stroke and Luminous Art Spark -->
  <g filter="url(#softGlow)">
    <!-- Outer Diamond Canvas Frame (Sleek Rhombus) -->
    <rect x="161" y="161" width="190" height="190" rx="34" transform="rotate(45 256 256)" 
          fill="none" stroke="url(#goldGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Abstract Sweeping Painterly Brush Arc (Energy & Creation) -->
    <path d="M 175 325 C 195 240, 245 195, 335 175 C 295 230, 255 270, 175 325 Z" fill="url(#goldGrad)"/>

    <!-- Central Four-Point Luminous Star / Light Prism (Inspiration) -->
    <path d="M 256 210 Q 256 256 302 256 Q 256 256 256 302 Q 256 256 210 256 Q 256 256 256 210 Z" fill="url(#goldLight)"/>

    <!-- Core Accent Pearl / Paint Highlight -->
    <circle cx="256" cy="256" r="12" fill="#FFFFFF"/>
    <circle cx="370" cy="142" r="9" fill="url(#goldLight)"/>
  </g>
</svg>
